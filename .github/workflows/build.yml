name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test
    runs-on: macos-15
    timeout-minutes: 20

    # CI builds use no code signing (faster, sufficient for testing)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Every Class Has Its Own Deinit
        run: python3 -I .github/scripts/check_explicit_deinit.py "Claude Usage"

      - name: Select Xcode 26.0.1
        run: sudo xcode-select -s /Applications/Xcode_26.0.1.app/Contents/Developer

      - name: Show Build Environment
        run: |
          xcodebuild -version
          swift --version
          echo "macOS: $(sw_vers -productVersion)"

      - name: Build Debug (for tests)
        run: |
          xcodebuild build \
            -project "Claude Usage.xcodeproj" \
            -scheme "Claude Usage" \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Run Tests
        run: |
          xcodebuild test \
            -project "Claude Usage.xcodeproj" \
            -scheme "Claude Usage" \
            -configuration Debug \
            -derivedDataPath build \
            -destination "platform=macOS" \
            -resultBundlePath Tests.xcresult \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Show Test Failure Messages
        if: failure()
        run: |
          test -d Tests.xcresult || exit 0
          xcrun xcresulttool get test-results tests --path Tests.xcresult --format json > Tests.json
          node -e 'const r=require("./Tests.json"); function walk(n,t){ if(n.nodeType==="Test Case") t=n.name; if(n.nodeType==="Failure Message") console.log(t+": "+n.name); (n.children||[]).forEach(c=>walk(c,t)); }; r.testNodes.forEach(n=>walk(n,""))'

      - name: Build Release
        run: |
          xcodebuild build \
            -project "Claude Usage.xcodeproj" \
            -scheme "Claude Usage" \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Create App Bundle Artifact
        run: |
          mkdir -p artifacts
          cp -R "build/Build/Products/Release/Usage Shelf.app" artifacts/

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Claude-Usage-${{ github.sha }}
          path: artifacts/
          retention-days: 7
