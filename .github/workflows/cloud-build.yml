name: Cloud Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    name: Unsigned Build and Cleaning Mode Tests
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.0.1
        run: sudo xcode-select -s /Applications/Xcode_26.0.1.app/Contents/Developer

      - name: Show Build Environment
        run: |
          xcodebuild -version
          swift --version
          echo "macOS: $(sw_vers -productVersion)"

      - name: Build Debug
        run: |
          xcodebuild build \
            -project "Claude Usage.xcodeproj" \
            -scheme "Claude Usage" \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Run Isolated Cleaning Mode Tests
        run: |
          xcodebuild test \
            -project "Claude Usage.xcodeproj" \
            -scheme "Claude Usage" \
            -configuration Debug \
            -derivedDataPath build \
            -destination "platform=macOS" \
            -only-testing:"Claude UsageTests/CleaningModeTests" \
            -resultBundlePath "CleaningMode.xcresult" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Build Unsigned Release
        run: |
          xcodebuild build \
            -project "Claude Usage.xcodeproj" \
            -scheme "Claude Usage" \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Create App and Test Screenshot Artifacts
        run: |
          mkdir -p artifacts
          cp -R "build/Build/Products/Release/Usage Shelf.app" artifacts/
          cp -R "/tmp/usage-shelf-cleaning-mode-shots" artifacts/cleaning-mode-shots
          test -f "artifacts/Usage Shelf.app/Contents/MacOS/Usage Shelf"

      - name: Upload Unsigned Build
        uses: actions/upload-artifact@v4
        with:
          name: cleaning-mode-${{ github.sha }}
          path: artifacts/
          retention-days: 7
