name: Cloud Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    name: Unsigned Build and Cleaning Mode Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15-intel, xcode: "26.3" }
          - { os: macos-15, xcode: "26.3" }
          - { os: macos-26, xcode: "26.6" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode ${{ matrix.xcode }}
        run: sudo xcode-select -s "/Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer"

      - name: Check Every Class Has Its Own Deinit
        run: python3 -I .github/scripts/check_explicit_deinit.py "Claude Usage"

      - name: Show Build Environment
        run: |
          xcodebuild -version
          swift --version
          echo "macOS: $(sw_vers -productVersion)"

      - name: Build Debug
        run: |
          xcodebuild build \
            -project "Claude Usage.xcodeproj" \
            -scheme "Claude Usage" \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Run Isolated Cleaning Mode Tests
        run: |
          xcodebuild test \
            -project "Claude Usage.xcodeproj" \
            -scheme "Claude Usage" \
            -configuration Debug \
            -derivedDataPath build \
            -destination "platform=macOS" \
            -only-testing:"Claude UsageTests/CleaningModeTests" \
            -only-testing:"Claude UsageTests/TopShelfTests" \
            -only-testing:"Claude UsageTests/TopShelfSettingsPageTests" \
            -resultBundlePath "CleaningMode.xcresult" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Summarize Cleaning Mode Results
        if: always()
        run: |
          if test -d CleaningMode.xcresult; then
            xcrun xcresulttool get test-results tests --path CleaningMode.xcresult --format json > CleaningModeTests.json
            node -e 'const r=require("./CleaningModeTests.json"); function walk(n){ if(n.nodeType==="Test Case") console.log(n.name+": "+n.result); (n.children||[]).forEach(walk); }; r.testNodes.forEach(walk)'
          fi

      - name: Collect Crash Reports
        if: always()
        run: |
          mkdir -p crash-reports
          find ~/Library/Logs/DiagnosticReports /Library/Logs/DiagnosticReports -name 'Usage Shelf*' -exec cp {} crash-reports/ \; 2>/dev/null || true
          for f in crash-reports/*; do test -f "$f" && head -c 6000 "$f"; done || true

      - name: Upload Test Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cleaning-mode-test-evidence-${{ matrix.os }}-${{ github.sha }}
          path: |
            CleaningMode.xcresult
            CleaningModeTests.json
            crash-reports
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0

      - name: Build Unsigned Release
        run: |
          xcodebuild build \
            -project "Claude Usage.xcodeproj" \
            -scheme "Claude Usage" \
            -configuration Release \
            -derivedDataPath build \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Create App and Test Screenshot Artifacts
        run: |
          mkdir -p artifacts
          cp -R "build/Build/Products/Release/Usage Shelf.app" artifacts/
          cp -R "/tmp/usage-shelf-cleaning-mode-shots" artifacts/cleaning-mode-shots
          cp -R "/tmp/usage-shelf-settings-shots" artifacts/settings-shots
          test -f "artifacts/Usage Shelf.app/Contents/MacOS/Usage Shelf"
          lipo -info "artifacts/Usage Shelf.app/Contents/MacOS/Usage Shelf"

      - name: Upload Unsigned Build
        uses: actions/upload-artifact@v4
        with:
          name: cleaning-mode-${{ matrix.os }}-${{ github.sha }}
          path: artifacts/
          retention-days: 7
